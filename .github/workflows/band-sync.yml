name: band-sync

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: band-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: pip install requests cryptography

      - name: fetch band sleep
        env:
          BAND_CREDS: ${{ secrets.BAND_CREDS }}
          BAND_KEY: ${{ secrets.BAND_KEY }}
        run: python band_action.py

      - name: commit data
        run: |
          git config user.name "band-sync-bot"
          git config user.email "band-sync-bot@users.noreply.github.com"
          git add band-state.enc data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "band sync $(date -u +%FT%TZ)"
            git push
          fi
